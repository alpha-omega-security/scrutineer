<div id="repo-scans">
{{if or (gt .ActiveScans 0) (gt .PausedScans 0) (gt .FailedScans 0)}}
  <div class="flex justify-end gap-2 mb-2">
    {{if gt .ActiveScans 0}}
    <form method="post" action="/scans/cancel-all?repository={{.Repo.ID}}"
          hx-post="/scans/cancel-all?repository={{.Repo.ID}}" hx-swap="none"
          hx-confirm="Cancel all {{.ActiveScans}} running or queued scan(s) on {{.Repo.Name}}? Any work in progress is discarded.">
      <button type="submit" class="btn-outline">
        <i data-lucide="x"></i> Cancel all ({{.ActiveScans}})
      </button>
    </form>
    {{end}}
    {{if gt .PausedScans 0}}
    <form method="post" action="/scans/resume-paused?repository={{.Repo.ID}}"
          hx-post="/scans/resume-paused?repository={{.Repo.ID}}" hx-swap="none"
          hx-confirm="Resume all {{.PausedScans}} paused scan(s) on {{.Repo.Name}}?">
      <button type="submit" class="btn-outline">
        <i data-lucide="play"></i> Resume all ({{.PausedScans}})
      </button>
    </form>
    {{end}}
    {{if gt .FailedScans 0}}
    <form method="post" action="/scans/retry-failed?repository={{.Repo.ID}}"
          hx-post="/scans/retry-failed?repository={{.Repo.ID}}" hx-swap="none"
          hx-confirm="Re-enqueue every failed scan on this repository?">
      <button type="submit" class="btn-outline">
        <i data-lucide="refresh-cw"></i> Retry failed ({{.FailedScans}})
      </button>
    </form>
    {{end}}
  </div>
{{end}}
<table class="table">
  <thead>
    <tr><th>#</th><th>Skill</th><th>Status</th><th>Findings</th><th>Model</th><th>Cost</th><th>Commit</th><th>Started</th><th>Duration</th><th class="w-12"></th></tr>
  </thead>
  {{template "scan_rows" .}}
</table>
</div>
