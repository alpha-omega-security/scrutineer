plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.secure_notes_example'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.secure_notes_example'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

flutter {
    source '../..'
}
